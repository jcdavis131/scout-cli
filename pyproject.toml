[project]
name = "scout-cli"
version = "0.7.1"
description = "Scout CLI 🐾 — personal control plane (ex-BigBang). Agent-native, security-first, Ava brain + authentic writing + lab MRR + RTX offload. HOME-only. Single CLI Doctrine v0.7.1."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cameron Davis", email = "jcdavis131@gmail.com"}]
keywords = ["scout", "cli", "agent", "tools", "mcp", "personal", "automation", "kitty"]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "pydantic-settings>=2.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "click>=8.1",
  "mcp>=1.28.1",
]

[project.optional-dependencies]
all = ["gspread", "supabase", "onnxruntime", "keyring", "cryptography", "mcp>=1.28.1"]
dev = ["pytest>=8", "ruff>=0.8", "pre-commit>=3.7", "mypy>=1.10", "pytest-cov"]
security = ["keyring", "cryptography"]

[project.urls]
Homepage = "https://github.com/jcdavis131/scout-cli"
Repository = "https://github.com/jcdavis131/scout-cli"
Issues = "https://github.com/jcdavis131/scout-cli/issues"

[project.scripts]
scout = "bigbang.cli:app"
bb = "bigbang.cli:app"
bigbang = "bigbang.cli:app"
dv = "bigbang.cli:app"
kitty = "bigbang.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bigbang"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["graphify-out*", "docs/llm-wiki", ".venv", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "PTH", "TCH", "RUF"]
ignore = [
  "S101",
  "S603",
  "S607",
  "S110",
  "N803",
  "E501",
  "W505",
  "RUF001",
  "RUF005",
  "S112",
  "B008",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["bigbang", "scout_cli", "bigbang_cli"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
